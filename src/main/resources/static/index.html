<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARC - Adaptive Routine Coach</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0e0f10;
      font-family: "Montserrat", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;

      background-image: url("images/background.png");
      background-size: cover;
      background-position: center;

      position: relative;
      overflow: hidden;
    }

    .overlay {
      position: absolute;
      inset: 0;

      background:
              linear-gradient(
                      to bottom,
                      rgba(14,15,16,.18) 0%,
                      rgba(14,15,16,.12) 45%,
                      rgba(14,15,16,.72) 78%,
                      rgba(14,15,16,.95) 100%
              );
    }

    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      color: #f5f7f7;
      text-align: center;
    }

    .arc-logo-img {
      position: absolute;
      top: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: auto;
    }

    h1 {
      position: absolute;
      top: 220px;
      width: 100%;
      margin: 0;

      font-size: 48px;
      font-weight: 700;
    }

    .subtitle {
      position: absolute;
      top: 285px;
      width: 100%;

      color: #a5a5a7;
      font-size: 14px;
    }

    button {
      position: absolute;
      bottom: 125px;
      left: 8%;
      width: 84%;
      height: 58px;

      border: none;
      border-radius: 16px;

      background: #1cfb9e;
      color: #000;

      font-family: "Montserrat", Arial, sans-serif;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(.92);
    }

    .tagline {
      position: absolute;
      bottom: 78px;
      width: 100%;

      color: #a5a5a7;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="overlay"></div>

  <div class="content">

    <img src="images/arc-logo.png"
         class="arc-logo-img"
         alt="ARC logo">

    <h1>ARC</h1>

    <p class="subtitle">
      Adaptive Routine Coach
    </p>

    <button onclick="window.location.href='login.html'">
      Get Started
    </button>

    <p class="tagline">
      A stronger you awaits.
    </p>

  </div>

</div>

</body>
</html>
