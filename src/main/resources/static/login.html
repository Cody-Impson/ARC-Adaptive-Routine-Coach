<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARC Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0e0f10;
      font-family: "Montserrat", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      color: #f5f7f7;
      padding: 70px 22px 40px;
    }

    .brand {
      font-size: 38px;
      font-weight: 700;
      margin: 0;
    }

    .subtitle {
      color: #a5a5a7;
      font-size: 13px;
      margin-top: 3px;
    }

    h2 {
      margin: 38px 0 5px;
      font-size: 28px;
    }

    .helper {
      color: #a5a5a7;
      font-size: 13px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #b0b2b5;
      font-size: 12px;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      height: 54px;
      border: none;
      outline: none;
      border-radius: 14px;
      background: #2a2d31;
      color: white;
      padding: 0 15px;
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 14px;
    }

    .primary {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 16px;
      background: #1cfb9e;
      color: black;
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 24px;
    }

    .secondary {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 14px;
      background: #2a2d31;
      color: #1cfb9e;
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    .forgot {
      display: block;
      text-align: center;
      color: #a5a5a7;
      text-decoration: none;
      font-size: 12px;
      margin-top: 16px;
    }

    #message {
      min-height: 18px;
      text-align: center;
      font-size: 12px;
      margin-top: 14px;
      line-height: 1.5;
    }

    .error {
      color: #ff6b6b;
    }

    .success {
      color: #1cfb9e;
    }

    .demo-note {
      margin-top: 28px;
      color: #777b80;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">

  <h1 class="brand">ARC</h1>

  <div class="subtitle">
    Adaptive Routine Coach
  </div>

  <h2>Welcome back</h2>

  <div class="helper">
    Sign in to continue your training.
  </div>


  <label>Email</label>

  <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
  >


  <label>Password</label>

  <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          onkeydown="handleEnter(event)"
  >


  <button
          class="primary"
          onclick="signIn()">
    Sign In
  </button>


  <button
          class="secondary"
          onclick="createAccount()">
    Create Account
  </button>


  <a
          class="forgot"
          href="#"
          onclick="forgotPassword(event)">
    Forgot password?
  </a>


  <div id="message"></div>


  <div class="demo-note">
    ARC demo accounts are saved locally on this device.
  </div>

</div>


<script>

  /*
  ==================================================
  ARC MULTI-USER DEMO ACCOUNT SYSTEM
  ==================================================
  Each email gets its own saved copy of:

  Profile
  Training goals
  Equipment
  Readiness
  Workout
  History
  ==================================================
  */


  const USER_DATA_KEYS = [

    "arcProfileStep1",
    "arcProfileStep2",
    "arcProfileStep3",

    "arcReadinessResult",

    "arcCurrentWorkout",

    "arcCompletedSets",
    "arcLastCompletedSet",

    "arcWorkoutComplete",

    "arcExerciseIndex",
    "arcCurrentSet",

    "arcSubstituteExercise",

    "arcUserName"

  ];



  function normalizeEmail(email) {

    return email
            .trim()
            .toLowerCase();

  }



  function getAccounts() {

    try {

      return JSON.parse(
              localStorage.getItem(
                      "arcAccounts"
              )
      ) || {};

    }
    catch {

      return {};

    }

  }



  function saveAccounts(accounts) {

    localStorage.setItem(
            "arcAccounts",
            JSON.stringify(accounts)
    );

  }



  function setMessage(text, type) {

    const message =
            document.getElementById(
                    "message"
            );

    message.textContent =
            text;

    message.className =
            type || "";

  }



  /*
  ==================================================
  SAVE CURRENT USER'S ARC DATA
  ==================================================
  Before switching accounts, save everything
  the current person has done.
  ==================================================
  */

  function saveCurrentUserData() {

    const currentEmail =
            localStorage.getItem(
                    "arcCurrentUserEmail"
            );


    if (!currentEmail) {
      return;
    }


    const accounts =
            getAccounts();


    if (!accounts[currentEmail]) {
      return;
    }


    const snapshot = {};


    USER_DATA_KEYS.forEach(
            function(key) {

              const value =
                      localStorage.getItem(key);


              if (value !== null) {

                snapshot[key] =
                        value;

              }

            }
    );


    accounts[currentEmail].data =
            snapshot;


    saveAccounts(accounts);

  }



  /*
  ==================================================
  CLEAR ACTIVE USER DATA
  ==================================================
  This prevents Cody's information from appearing
  when Bob creates or signs into another account.
  ==================================================
  */

  function clearActiveUserData() {

    USER_DATA_KEYS.forEach(
            function(key) {

              localStorage.removeItem(
                      key
              );

            }
    );

  }



  /*
  ==================================================
  LOAD SELECTED USER
  ==================================================
  ==================================================
  */

  function loadUserData(email) {

    const accounts =
            getAccounts();


    const account =
            accounts[email];


    if (!account) {
      return;
    }


    clearActiveUserData();


    const data =
            account.data || {};


    Object.keys(data).forEach(
            function(key) {

              localStorage.setItem(
                      key,
                      data[key]
              );

            }
    );


    localStorage.setItem(
            "arcCurrentUserEmail",
            email
    );


    localStorage.setItem(
            "arcLoggedIn",
            "true"
    );

  }



  /*
  ==================================================
  CREATE ACCOUNT
  ==================================================
  */

  function createAccount() {

    const email =
            normalizeEmail(
                    document
                            .getElementById("email")
                            .value
            );


    const password =
            document
                    .getElementById("password")
                    .value;


    if (!email) {

      setMessage(
              "Enter an email address first.",
              "error"
      );

      return;

    }


    if (!password) {

      setMessage(
              "Create a password first.",
              "error"
      );

      return;

    }


    if (password.length < 4) {

      setMessage(
              "Password must be at least 4 characters.",
              "error"
      );

      return;

    }


    /*
    Save whoever is currently using ARC
    before switching accounts.
    */

    saveCurrentUserData();


    const accounts =
            getAccounts();


    if (accounts[email]) {

      setMessage(
              "An account already exists for this email. Sign in instead.",
              "error"
      );

      return;

    }


    /*
    Create completely separate account.
    */

    accounts[email] = {

      password:
      password,

      data: {

        arcProfileStep1:
                JSON.stringify({
                  email: email
                })

      }

    };


    saveAccounts(accounts);


    /*
    Remove Cody/Bob/etc. current data
    and load the brand-new account.
    */

    loadUserData(email);


    setMessage(
            "Account created. Starting your profile setup.",
            "success"
    );


    setTimeout(
            function() {

              window.location.href =
                      "profile.html";

            },
            400
    );

  }



  /*
  ==================================================
  SIGN IN
  ==================================================
  */

  function signIn() {

    const email =
            normalizeEmail(
                    document
                            .getElementById("email")
                            .value
            );


    const password =
            document
                    .getElementById("password")
                    .value;


    if (!email || !password) {

      setMessage(
              "Enter your email and password.",
              "error"
      );

      return;

    }


    const accounts =
            getAccounts();


    const account =
            accounts[email];


    if (!account) {

      setMessage(
              "No account found for that email. Create an account first.",
              "error"
      );

      return;

    }


    if (
            account.password !==
            password
    ) {

      setMessage(
              "Incorrect password.",
              "error"
      );

      return;

    }


    /*
    Save current account before changing users.
    */

    saveCurrentUserData();


    /*
    Load this user's personal ARC data.
    */

    loadUserData(email);


    setMessage(
            "Welcome back.",
            "success"
    );


    setTimeout(
            function() {

              window.location.href =
                      "home.html";

            },
            350
    );

  }



  /*
  ==================================================
  FORGOT PASSWORD
  ==================================================
  Demo-only helper.
  ==================================================
  */

  function forgotPassword(event) {

    event.preventDefault();


    const email =
            normalizeEmail(
                    document
                            .getElementById("email")
                            .value
            );


    if (!email) {

      setMessage(
              "Enter your email address first.",
              "error"
      );

      return;

    }


    const accounts =
            getAccounts();


    if (!accounts[email]) {

      setMessage(
              "No ARC account was found for that email.",
              "error"
      );

      return;

    }


    setMessage(
            "Demo account found. Password recovery would be added in a production version.",
            "success"
    );

  }



  function handleEnter(event) {

    if (
            event.key ===
            "Enter"
    ) {

      signIn();

    }

  }



  /*
  ==================================================
  WHEN LOGIN PAGE OPENS
  ==================================================

  Save the person who was just using ARC.

  This is important because the rest of your app
  still uses the normal arcProfileStep1 etc. keys.

  ==================================================
  */

  saveCurrentUserData();



  /*
  Pre-fill current account email if one exists.
  */

  const currentEmail =
          localStorage.getItem(
                  "arcCurrentUserEmail"
          );


  if (currentEmail) {

    document.getElementById(
            "email"
    ).value =
            currentEmail;

  }

</script>

</body>
</html>
