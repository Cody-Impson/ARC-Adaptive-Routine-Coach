<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC Readiness</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
          rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #0e0f10;
            font-family: "Montserrat", Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            color: white;
        }

        .app {
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            padding: 28px 22px 80px;
        }

        .back {
            color: #1cfb9e;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        h1 {
            margin: 28px 0 4px;
            font-size: 29px;
        }

        .subtitle {
            color: #a5a5a7;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        label {
            display: block;
            color: #b0b2b5;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input, select, textarea {
            width: 100%;
            border: none;
            outline: none;
            border-radius: 13px;
            background: #2a2d31;
            color: white;
            font-family: "Montserrat";
            font-size: 14px;
            padding: 0 14px;
        }

        input, select {
            height: 52px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
            padding-top: 14px;
        }

        .field {
            margin-bottom: 16px;
        }

        .full {
            margin-top: 16px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 15px;
            font-family: "Montserrat";
            font-weight: 700;
            cursor: pointer;
        }

        .check {
            height: 58px;
            margin-top: 22px;
            background: #1cfb9e;
            color: black;
            font-size: 17px;
        }

        .next {
            height: 55px;
            margin-top: 14px;
            background: #1cfb9e;
            color: black;
            font-size: 15px;
            display: none;
        }

        .result {
            background: #202326;
            border-radius: 16px;
            padding: 18px;
            margin-top: 22px;
            display: none;
        }

        .result-title {
            color: #1cfb9e;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        #resultText {
            white-space: pre-line;
            font-size: 13px;
            line-height: 1.55;
        }
    </style>
</head>

<body>

<div class="app">

    <a class="back" href="home.html">‹ Home</a>

    <h1>Daily Readiness</h1>

    <div class="subtitle">
        Tell ARC how you're feeling before training.
    </div>

    <div class="grid">

        <div class="field">
            <label>Sleep Quality (1-10)</label>
            <input id="sleep" type="number" min="1" max="10">
        </div>

        <div class="field">
            <label>Energy (1-10)</label>
            <input id="energy" type="number" min="1" max="10">
        </div>

        <div class="field">
            <label>Soreness (1-10)</label>
            <input id="soreness" type="number" min="1" max="10">
        </div>

        <div class="field">
            <label>Stress (1-10)</label>
            <input id="stress" type="number" min="1" max="10">
        </div>

        <div class="field">
            <label>Motivation (1-10)</label>
            <input id="motivation" type="number" min="1" max="10">
        </div>

        <div class="field">
            <label>Pain / discomfort?</label>

            <select id="pain" onchange="togglePain()">
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

    </div>

    <div id="painBox" class="field full" style="display:none;">
        <label>Describe pain or discomfort</label>
        <input id="painDetails" type="text">
    </div>

    <div class="field full">
        <label>Anything to share with ORIN?</label>

        <textarea
                id="notes"
                maxlength="1000"
                placeholder="Anything that may affect today's workout..."></textarea>
    </div>

    <button class="check" onclick="checkReadiness()">
        Check Readiness
    </button>

    <div id="resultCard" class="result">

        <div class="result-title">
            ORIN Recommendation
        </div>

        <div id="resultText"></div>

    </div>

    <button id="nextButton"
            class="next"
            onclick="window.location.href='workout.html'">
        Continue to Today's Workout →
    </button>

</div>

<script>

    function togglePain() {

        const pain =
            document.getElementById("pain").value;

        document.getElementById("painBox").style.display =
            pain === "Yes"
                ? "block"
                : "none";
    }


    async function checkReadiness() {

        const data = {

            sleepQuality:
                Number(document.getElementById("sleep").value),

            energy:
                Number(document.getElementById("energy").value),

            soreness:
                Number(document.getElementById("soreness").value),

            stress:
                Number(document.getElementById("stress").value),

            motivation:
                Number(document.getElementById("motivation").value),

            pain:
            document.getElementById("pain").value,

            painDetails:
                document.getElementById("painDetails").value.trim(),

            notes:
                document.getElementById("notes").value.trim()

        };


        try {

            const response =
                await fetch("/readiness", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body:
                        JSON.stringify(data)

                });


            const text =
                await response.text();


            document.getElementById("resultCard").style.display =
                "block";

            document.getElementById("resultText").textContent =
                text;


            if (response.ok) {

                localStorage.setItem(
                    "arcReadinessResult",
                    text
                );


                document.getElementById("nextButton").style.display =
                    "block";

            }
            else {

                document.getElementById("nextButton").style.display =
                    "none";

            }

        }
        catch (error) {

            document.getElementById("resultCard").style.display =
                "block";

            document.getElementById("resultText").textContent =
                "Unable to complete readiness check.";

        }

    }

</script>

</body>
</html>
