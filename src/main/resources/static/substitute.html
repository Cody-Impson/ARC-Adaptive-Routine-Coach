<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ARC Substitute Exercise</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #0e0f10;
            font-family: "Montserrat", Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            color: white;
        }

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 25px 20px 70px;
        }

        .back {
            display: inline-block;
            background: #2a2d31;
            color: #1cfb9e;
            text-decoration: none;
            border-radius: 11px;
            padding: 10px 13px;
            font-size: 12px;
            font-weight: 600;
        }

        h1 {
            margin: 28px 0 5px;
            font-size: 28px;
        }

        .subtitle {
            color: #a5a5a7;
            font-size: 13px;
            line-height: 1.5;
        }

        .current {
            background: #202326;
            border-radius: 15px;
            padding: 17px;
            margin-top: 24px;
        }

        .label {
            color: #a5a5a7;
            font-size: 11px;
            font-weight: 600;
        }

        .current-name {
            font-size: 20px;
            font-weight: 700;
            margin-top: 7px;
        }

        .heading {
            color: #a5a5a7;
            font-size: 12px;
            font-weight: 600;
            margin: 28px 0 12px;
        }

        .option {
            width: 100%;
            text-align: left;
            background: #2a2d31;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 17px;
            margin-bottom: 12px;
            font-family: "Montserrat";
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .option:active {
            transform: scale(.98);
            background: #35393e;
        }

        .name {
            font-size: 16px;
            font-weight: 700;
        }

        .meta {
            color: #a5a5a7;
            font-size: 12px;
            margin-top: 6px;
        }

        .reason {
            color: #1cfb9e;
            font-size: 11px;
            margin-top: 7px;
            font-weight: 600;
        }

        #message {
            text-align: center;
            color: #1cfb9e;
            font-size: 12px;
            margin-top: 18px;
        }

    </style>

</head>

<body>

<div class="app">

    <a class="back"
       href="active-set.html">
        ‹ Current Exercise
    </a>


    <h1>
        Substitute Exercise
    </h1>


    <div class="subtitle">
        Choose another movement and ARC will replace
        the current exercise in today's workout.
    </div>


    <div class="current">

        <div class="label">
            CURRENT EXERCISE
        </div>

        <div class="current-name"
             id="currentName">
            Exercise
        </div>

    </div>


    <div class="heading">
        Recommended substitutes
    </div>


    <div id="options"></div>


    <div id="message"></div>

</div>


<script>

    function getWorkout() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    "arcCurrentWorkout"
                )
            );

        }
        catch {

            return null;

        }

    }


    let workout =
        getWorkout();


    let index =
        Number(
            localStorage.getItem(
                "arcSubstituteIndex"
            )
        );


    if (
        !workout ||
        !Array.isArray(workout.exercises) ||
        Number.isNaN(index) ||
        !workout.exercises[index]
    ) {

        window.location.href =
            "active-set.html";

    }


    const original =
        workout.exercises[index];


    document.getElementById(
        "currentName"
    ).textContent =
        original.name;



    function makeExercise(
        name,
        sets,
        reps,
        weight,
        equipment,
        type,
        unit
    ) {

        return {

            name:
            name,

            sets:
                sets || original.sets || 3,

            reps:
                reps || original.reps || 10,

            weight:
                weight || 0,

            equipment:
                equipment || "Bodyweight",

            type:
                type || "reps",

            unit:
                unit || "reps"

        };

    }



    function chooseSubstitutes() {

        const name =
            original.name.toLowerCase();


        if (
            name.includes("press") ||
            name.includes("push-up") ||
            name.includes("push up")
        ) {

            return [

                makeExercise(
                    "Dumbbell Bench Press",
                    original.sets,
                    10,
                    40,
                    "Dumbbells"
                ),

                makeExercise(
                    "Incline Dumbbell Press",
                    original.sets,
                    10,
                    35,
                    "Dumbbells"
                ),

                makeExercise(
                    "Seated Chest Press Machine",
                    original.sets,
                    10,
                    70,
                    "Machines"
                ),

                makeExercise(
                    "Push-Up",
                    original.sets,
                    12,
                    0,
                    "Bodyweight"
                )

            ];

        }


        if (
            name.includes("row") ||
            name.includes("pulldown")
        ) {

            return [

                makeExercise(
                    "One-Arm Dumbbell Row",
                    original.sets,
                    10,
                    40,
                    "Dumbbells"
                ),

                makeExercise(
                    "Seated Cable Row",
                    original.sets,
                    12,
                    70,
                    "Cables"
                ),

                makeExercise(
                    "Lat Pulldown",
                    original.sets,
                    10,
                    80,
                    "Machine"
                ),

                makeExercise(
                    "Inverted Row",
                    original.sets,
                    10,
                    0,
                    "Bodyweight"
                )

            ];

        }


        if (
            name.includes("curl")
        ) {

            return [

                makeExercise(
                    "Dumbbell Biceps Curl",
                    original.sets,
                    12,
                    25,
                    "Dumbbells"
                ),

                makeExercise(
                    "Hammer Curl",
                    original.sets,
                    12,
                    25,
                    "Dumbbells"
                ),

                makeExercise(
                    "Cable Concentration Curl",
                    original.sets,
                    12,
                    35,
                    "Cables"
                ),

                makeExercise(
                    "Resistance Band Curl",
                    original.sets,
                    15,
                    0,
                    "Bands"
                )

            ];

        }


        if (
            name.includes("triceps") ||
            name.includes("pushdown")
        ) {

            return [

                makeExercise(
                    "Cable Rope Triceps Pushdown",
                    original.sets,
                    12,
                    40,
                    "Cables"
                ),

                makeExercise(
                    "Dumbbell Triceps Extension",
                    original.sets,
                    12,
                    25,
                    "Dumbbells"
                ),

                makeExercise(
                    "Close-Grip Push-Ups",
                    original.sets,
                    12,
                    0,
                    "Bodyweight"
                ),

                makeExercise(
                    "Bench Dips",
                    original.sets,
                    12,
                    0,
                    "Bodyweight"
                )

            ];

        }


        if (
            name.includes("squat") ||
            name.includes("lunge")
        ) {

            return [

                makeExercise(
                    "Bodyweight Squat",
                    original.sets,
                    15,
                    0,
                    "Bodyweight"
                ),

                makeExercise(
                    "Dumbbell Goblet Squat",
                    original.sets,
                    12,
                    35,
                    "Dumbbells"
                ),

                makeExercise(
                    "Alternating Reverse Lunges",
                    original.sets,
                    12,
                    0,
                    "Bodyweight"
                ),

                makeExercise(
                    "Step-Ups",
                    original.sets,
                    12,
                    0,
                    "Bodyweight"
                )

            ];

        }


        if (
            name.includes("plank") ||
            name.includes("core")
        ) {

            return [

                makeExercise(
                    "High Plank",
                    original.sets,
                    45,
                    0,
                    "Bodyweight",
                    "time",
                    "sec"
                ),

                makeExercise(
                    "Side Plank",
                    original.sets,
                    30,
                    0,
                    "Bodyweight",
                    "time",
                    "sec"
                ),

                makeExercise(
                    "Seated Knee Tuck",
                    original.sets,
                    15,
                    0,
                    "Bodyweight"
                ),

                makeExercise(
                    "Mountain Climbers",
                    original.sets,
                    20,
                    0,
                    "Bodyweight"
                )

            ];

        }


        if (
            name.includes("walking") ||
            name.includes("bike") ||
            name.includes("cardio") ||
            name.includes("rowing machine")
        ) {

            return [

                makeExercise(
                    "Walking",
                    original.sets,
                    10,
                    0,
                    "Cardio",
                    "time",
                    "min"
                ),

                makeExercise(
                    "Stationary Bike",
                    original.sets,
                    8,
                    0,
                    "Cardio",
                    "time",
                    "min"
                ),

                makeExercise(
                    "Indoor Rowing Machine",
                    original.sets,
                    8,
                    0,
                    "Cardio",
                    "time",
                    "min"
                ),

                makeExercise(
                    "March or Jog in Place",
                    original.sets,
                    5,
                    0,
                    "Bodyweight",
                    "time",
                    "min"
                )

            ];

        }


        return [

            makeExercise(
                "Bodyweight Squat",
                original.sets,
                15,
                0,
                "Bodyweight"
            ),

            makeExercise(
                "Push-Up",
                original.sets,
                12,
                0,
                "Bodyweight"
            ),

            makeExercise(
                "Walking",
                original.sets,
                5,
                0,
                "Bodyweight",
                "time",
                "min"
            ),

            makeExercise(
                "Plank",
                original.sets,
                30,
                0,
                "Bodyweight",
                "time",
                "sec"
            )

        ];

    }



    const substitutes =
        chooseSubstitutes();


    const options =
        document.getElementById(
            "options"
        );


    substitutes.forEach(
        function(exercise) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "option";


            let meta = "";


            if (
                exercise.type ===
                "time"
            ) {

                meta =
                    exercise.sets +
                    " rounds • " +
                    exercise.reps +
                    " " +
                    exercise.unit;

            }
            else {

                meta =
                    exercise.sets +
                    " × " +
                    exercise.reps +
                    " • " +
                    exercise.equipment;

            }


            button.innerHTML =

                "<div class='name'>" +
                exercise.name +
                "</div>" +

                "<div class='meta'>" +
                meta +
                "</div>" +

                "<div class='reason'>" +
                "Use this substitute" +
                "</div>";


            button.addEventListener(
                "click",
                function() {

                    selectExercise(
                        exercise
                    );

                }
            );


            options.appendChild(
                button
            );

        }
    );



    function selectExercise(
        replacement
    ) {

        workout =
            getWorkout();


        workout.exercises[index] =
            replacement;


        localStorage.setItem(
            "arcCurrentWorkout",
            JSON.stringify(workout)
        );


        localStorage.setItem(
            "arcCurrentSet",
            "1"
        );


        localStorage.setItem(
            "arcSubstituteExercise",
            replacement.name
        );


        document.getElementById(
            "message"
        ).textContent =
            replacement.name +
            " selected.";


        /*
         * Immediate navigation is more reliable
         * on mobile than the old delayed version.
         */

        window.location.href =
            "active-set.html";

    }

</script>

</body>
</html>
